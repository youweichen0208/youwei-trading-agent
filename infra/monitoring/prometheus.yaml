global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/yta-alerts.yaml]
scrape_configs:
  - job_name: yta-readiness
    metrics_path: /probe
    scrape_timeout: 5s
    params:
      module: [yta_ready]
    static_configs:
      - targets: [http://yta-bff:3100/api/yta/v1/ready]
        labels: {service: bff}
      - targets: [http://yta-web:3000/api/yta/v1/ready]
        labels: {service: web}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
