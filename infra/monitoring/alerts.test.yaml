{
  "rule_files": [
    "yta-alerts.yaml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "interval": "1m",
      "input_series": [
        {
          "series": "probe_success{job=\"yta-readiness\",service=\"bff\",instance=\"http://yta-bff:3100/api/yta/v1/ready\"}",
          "values": "0 0 0 1 1"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "1m",
          "alertname": "YTAServiceNotReady",
          "exp_alerts": []
        },
        {
          "eval_time": "2m",
          "alertname": "YTAServiceNotReady",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "yta-readiness",
                "service": "bff",
                "instance": "http://yta-bff:3100/api/yta/v1/ready",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "YTA bff readiness is failing"
              }
            }
          ]
        },
        {
          "eval_time": "4m",
          "alertname": "YTAServiceNotReady",
          "exp_alerts": []
        }
      ]
    },
    {
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"yta-readiness\",service=\"bff\",instance=\"http://yta-bff:3100/api/yta/v1/ready\"}",
          "values": "0 0 1"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "1m",
          "alertname": "YTAProbeScrapeFailed",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "yta-readiness",
                "service": "bff",
                "instance": "http://yta-bff:3100/api/yta/v1/ready",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "YTA bff probe cannot be scraped"
              }
            }
          ]
        },
        {
          "eval_time": "2m",
          "alertname": "YTAProbeScrapeFailed",
          "exp_alerts": []
        }
      ]
    },
    {
      "interval": "1m",
      "input_series": [],
      "alert_rule_test": [
        {
          "eval_time": "1m",
          "alertname": "YTAReadinessSeriesMissing",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "yta-readiness",
                "service": "bff",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "YTA bff readiness series is missing"
              }
            },
            {
              "exp_labels": {
                "job": "yta-readiness",
                "service": "web",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "YTA web readiness series is missing"
              }
            }
          ]
        }
      ]
    },
    {
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"yta-readiness\",service=\"bff\"}",
          "values": "1+0x4"
        },
        {
          "series": "up{job=\"yta-readiness\",service=\"web\"}",
          "values": "1+0x4"
        },
        {
          "series": "probe_success{job=\"yta-readiness\",service=\"bff\"}",
          "values": "1+0x4"
        },
        {
          "series": "probe_success{job=\"yta-readiness\",service=\"web\"}",
          "values": "1+0x4"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "3m",
          "alertname": "YTAServiceNotReady",
          "exp_alerts": []
        },
        {
          "eval_time": "3m",
          "alertname": "YTAProbeScrapeFailed",
          "exp_alerts": []
        },
        {
          "eval_time": "3m",
          "alertname": "YTAReadinessSeriesMissing",
          "exp_alerts": []
        }
      ]
    }
  ]
}
