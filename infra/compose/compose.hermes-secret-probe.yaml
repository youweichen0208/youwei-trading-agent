name: yta-hermes-secret-probe

# Real pi-selected model only in the default test Profile. No finance tools or public ports.
services:
  hermes:
    extends: {file: compose.hermes-profile-probe.yaml, service: hermes}
    network_mode: bridge
    entrypoint: ["python", "/probe/start_hermes_secret_probe.py"]
    environment:
      YTA_HERMES_SECRET_PROBE: "1"
    volumes:
      - model-scope-data:/opt/data
      - ../../scripts/start_hermes_secret_probe.py:/probe/start_hermes_secret_probe.py:ro
      - ../../scripts/probe_hermes_secrets.py:/probe/probe_hermes_secrets.py:ro
      - ../../scripts/check_hermes_secret_scope.py:/probe/check_hermes_secret_scope.py:ro

volumes:
  model-scope-data:
    name: yta-hermes-secret-probe-data
    external: true
