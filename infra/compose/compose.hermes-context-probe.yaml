name: yta-hermes-context-probe
# Synthetic-only model endpoint, no published ports, no external network.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [model]
  pids_limit: 256
services:
  model-fixture:
    <<: *hardening
    image: ${YTA_FINANCE_ALPHA_IMAGE:?Set immutable local Alpha image ID}
    pull_policy: never
    user: "10001:10001"
    command: [python, /probe/probe_hermes_gateway_context.py, model]
    environment:
      YTA_CONTEXT_GATEWAY_PROBE: "1"
      YTA_MODEL_FIXTURE_MODE: REPLAY
      YTA_MODEL_FIXTURE_TOKEN: synthetic-context-model
    volumes:
      - ../../scripts/probe_hermes_gateway_context.py:/probe/probe_hermes_gateway_context.py:ro
      - ../../scripts/hermes_model_fixture.py:/probe/hermes_model_fixture.py:ro
    mem_limit: 128m
  hermes:
    <<: *hardening
    image: sha256:67f82b05c5c083f2795cff9c361b4f5c464116fcc4301671709376e6f64e3226
    pull_policy: never
    init: true
    user: "10000:10000"
    entrypoint: [python, /probe/probe_hermes_gateway_context.py, bootstrap]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      API_SERVER_PORT: "8642"
      YTA_CONTEXT_GATEWAY_PROBE: "1"
      HERMES_HOME: /opt/data
    volumes:
      - context-data:/opt/data
      - ../../scripts/probe_hermes_gateway_context.py:/probe/probe_hermes_gateway_context.py:ro
      - ../../scripts/probe_hermes_failure.py:/probe/probe_hermes_failure.py:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777", "/run:rw,nosuid,nodev,size=16m,uid=10000,gid=10000,mode=0700"]
    mem_limit: 2g
    cpus: 2
    depends_on: [model-fixture]
networks:
  model: {internal: true}
volumes:
  context-data:
