name: yta-hermes-profile-probe

# Dedicated credential-free, network-none permission matrix; not the product Profile registry.
services:
  hermes:
    extends: {file: compose.hermes-probe.yaml, service: hermes}
    entrypoint: ["python", "/probe/start_hermes_profile_probe.py"]
    command: []
    environment:
      YTA_HERMES_PROFILE_PROBE: "1"
      YTA_PROFILE_PROBE_ALPHA_TOKEN: ${YTA_PROFILE_PROBE_ALPHA_TOKEN:?Set a separate Profile token}
    volumes:
      - ../../scripts/start_hermes_profile_probe.py:/probe/start_hermes_profile_probe.py:ro
      - ../../scripts/probe_hermes_profiles.py:/probe/probe_hermes_profiles.py:ro
      - ../../scripts/probe_hermes_failure.py:/probe/probe_hermes_failure.py:ro

volumes:
  hermes-probe-data:
