name: yta-hermes-probe

# Isolated startup/capability and credential-free failure protocol probes.
# No external network or model-provider credentials; use separate project volumes.
# Build the locked candidate first; never pull a similarly named remote image.
services:
  hermes:
    image: ${YTA_HERMES_PROBE_IMAGE:?Set the verified local image ID after build}
    pull_policy: never
    init: true
    user: "10000:10000"
    entrypoint: ["/opt/hermes/bin/hermes"]
    command: ["gateway", "run", "--no-supervise", "--external-supervisor"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${YTA_HERMES_PROBE_TOKEN:?Set an isolated probe token via a private env file}
      HERMES_GATEWAY_NO_SUPERVISE: "1"
    volumes:
      - hermes-probe-data:/opt/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,uid=10000,gid=10000,mode=0700
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  hermes-probe-data:
