# Explicit local REPLAY experiment override; authenticated BFF catalog, no model promotion.
# Combine with compose.app-local.yaml after preparing the dedicated test database.
services:
  alpha-engine:
    image: yta-alpha-training:local
    build:
      target: training-runtime
    environment:
      YTA_EXPERIMENTAL_MODELS: ENABLED
  yta-bff:
    environment:
      YTA_EXPERIMENTAL_MODELS: ENABLED
