name: yta-hermes-tool-cancel-probe

services:
  tool-fixture:
    image: ${YTA_FINANCE_TOOLS_IMAGE:?Set the immutable local tools image}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "/probe/hermes_delayed_tool_fixture.py"]
    environment:
      YTA_TOOL_CANCEL_PROBE: "1"
      YTA_FINANCE_MCP_TOKEN: ${YTA_FINANCE_MCP_TOKEN:?Set an isolated token}
    volumes: ["../../scripts/hermes_delayed_tool_fixture.py:/probe/hermes_delayed_tool_fixture.py:ro"]
    networks: [tools]
    mem_limit: 256m
    pids_limit: 64
  hermes:
    image: ${YTA_HERMES_PROBE_IMAGE:?Set the locked local Hermes image}
    pull_policy: never
    init: true
    user: "10000:10000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "/probe/start_hermes_tool_cancel_probe.py"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${YTA_HERMES_PROBE_TOKEN:?Set an isolated token}
      YTA_TOOL_CANCEL_PROBE: "1"
      YTA_FINANCE_MCP_TOKEN: ${YTA_FINANCE_MCP_TOKEN:?Set an isolated token}
    volumes:
      - data:/opt/data
      - ../../scripts/start_hermes_tool_cancel_probe.py:/probe/start_hermes_tool_cancel_probe.py:ro
      - ../../scripts/probe_hermes_tool_cancel.py:/probe/probe_hermes_tool_cancel.py:ro
      - ../../scripts/probe_hermes_failure.py:/probe/probe_hermes_failure.py:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777", "/run:rw,nosuid,nodev,size=16m,uid=10000,gid=10000,mode=0700"]
    networks: [egress, tools]
    mem_limit: 2g
    pids_limit: 256
    cpus: 2
    depends_on: [tool-fixture]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

networks:
  tools: {internal: true}
  egress: {}
volumes:
  data:
    name: yta-hermes-tool-cancel-probe-data
    external: true
