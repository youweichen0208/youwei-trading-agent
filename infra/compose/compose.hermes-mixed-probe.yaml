# Overlay compose.hermes-model-probe.yaml; isolated synthetic adversarial model.
services:
  model-fixture:
    command: [python, /probe/probe_hermes_mixed_tools.py, model]
    environment:
      YTA_MIXED_TOOL_PROBE: "1"
    volumes:
      - ../../scripts/probe_hermes_mixed_tools.py:/probe/probe_hermes_mixed_tools.py:ro
      - ../../scripts/probe_hermes_failure.py:/probe/probe_hermes_failure.py:ro
  hermes:
    environment:
      YTA_MIXED_TOOL_PROBE: "1"
    volumes:
      - ../../scripts/probe_hermes_mixed_tools.py:/probe/probe_hermes_mixed_tools.py:ro
