name: yta-hermes-pi-probe

# Actual model egress is permitted only on Hermes; finance data remains REPLAY.
services:
  alpha:
    extends: {file: compose.finance-probe.yaml, service: alpha}
  finance-tools:
    extends: {file: compose.finance-probe.yaml, service: finance-tools}
  hermes:
    image: ${YTA_HERMES_PROBE_IMAGE:?Set the fixed local Hermes image ID}
    pull_policy: never
    init: true
    user: "10000:10000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "/probe/start_hermes_pi_probe.py"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${YTA_HERMES_PROBE_TOKEN:?Set an isolated gateway token}
      YTA_PI_MODEL_PROBE: "1"
      YTA_FINANCE_MCP_TOKEN: ${YTA_FINANCE_MCP_TOKEN:?Set an isolated MCP token}
    volumes:
      - data:/opt/data
      - ../../scripts/start_hermes_pi_probe.py:/probe/start_hermes_pi_probe.py:ro
      - ../../scripts/probe_hermes_pi.py:/probe/probe_hermes_pi.py:ro
      - ../../scripts/probe_hermes_cancel.py:/probe/probe_hermes_cancel.py:ro
      - ../../scripts/probe_hermes_crash.py:/probe/probe_hermes_crash.py:ro
      - ../../scripts/probe_hermes_session.py:/probe/probe_hermes_session.py:ro
      - ../../scripts/probe_hermes_admission_loss.py:/probe/probe_hermes_admission_loss.py:ro
      - ../../scripts/probe_hermes_queued_cancel.py:/probe/probe_hermes_queued_cancel.py:ro
      - ../../scripts/probe_hermes_report.py:/probe/probe_hermes_report.py:ro
      - ../hermes/prompts/alpha-orchestrator.md:/probe/report-sop.md:ro
      - ../../packages/contracts/research-report.schema.json:/probe/report-schema.json:ro
      - ../../scripts/probe_hermes_failure.py:/probe/probe_hermes_failure.py:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777", "/run:rw,nosuid,nodev,size=16m,uid=10000,gid=10000,mode=0700"]
    networks: [egress, tools]
    mem_limit: 2g
    pids_limit: 256
    cpus: 2
    depends_on: [finance-tools]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

networks:
  alpha: {internal: true}
  tools: {internal: true}
  egress: {}
volumes:
  data:
    name: yta-hermes-pi-probe-data
    external: true
