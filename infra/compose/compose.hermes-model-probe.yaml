name: yta-hermes-model-probe

# Every network is internal. The model endpoint is a synthetic protocol fixture,
# never a fallback for LIVE_RESEARCH or evidence of successful real inference.
services:
  alpha:
    extends: {file: compose.finance-probe.yaml, service: alpha}
  finance-tools:
    extends: {file: compose.finance-probe.yaml, service: finance-tools}
  model-fixture:
    image: ${YTA_FINANCE_ALPHA_IMAGE:?Set an immutable local Alpha image ID}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "/probe/hermes_model_fixture.py"]
    environment:
      YTA_MODEL_FIXTURE_MODE: REPLAY
      YTA_MODEL_FIXTURE_TOKEN: ${YTA_MODEL_FIXTURE_TOKEN:?Set an isolated synthetic model token}
    volumes: ["../../scripts/hermes_model_fixture.py:/probe/hermes_model_fixture.py:ro"]
    networks: [model]
    mem_limit: 128m
    pids_limit: 64
  hermes:
    image: ${YTA_HERMES_PROBE_IMAGE:?Set the fixed local Hermes image ID}
    pull_policy: never
    init: true
    user: "10000:10000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "/probe/start_hermes_model_probe.py"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${YTA_HERMES_PROBE_TOKEN:?Set an isolated gateway token}
      OPENAI_API_KEY: ${YTA_MODEL_FIXTURE_TOKEN:?Set an isolated synthetic model token}
      OPENAI_BASE_URL: http://model-fixture:8300/v1
      YTA_MODEL_FIXTURE_MODE: REPLAY
      YTA_FINANCE_MCP_TOKEN: ${YTA_FINANCE_MCP_TOKEN:?Set an isolated MCP token}
    volumes:
      - hermes-model-probe-data:/opt/data
      - ../../scripts/start_hermes_model_probe.py:/probe/start_hermes_model_probe.py:ro
      - ../../scripts/probe_hermes_model.py:/probe/probe_hermes_model.py:ro
      - ../../scripts/probe_hermes_failure.py:/probe/probe_hermes_failure.py:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777", "/run:rw,nosuid,nodev,size=16m,uid=10000,gid=10000,mode=0700"]
    networks: [model, tools]
    mem_limit: 2g
    pids_limit: 256
    cpus: 2
    depends_on: [model-fixture, finance-tools]

networks:
  alpha: {internal: true}
  tools: {internal: true}
  model: {internal: true}
volumes:
  hermes-model-probe-data:
