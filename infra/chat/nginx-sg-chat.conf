# sg-prod nginx site: the chat backend entry (behind the CN ECS relay).
#
# Deployed by the chat-entry finish steps:
#   /etc/nginx/sites-available/sg-chat -> sites-enabled symlink
#   certbot --nginx -d sg-chat.youwei-agent.com (adds the 443/TLS block)
#
# Only the CN relay ECS may talk to this vhost; direct hits from anywhere
# else are denied (the Open WebUI itself is auth-gated, this just keeps
# the SG surface minimal). Websocket/SSE friendly: long timeouts,
# unbuffered, HTTP/1.1 upgrade headers, generous body size.

server {
    listen 80;
    server_name sg-chat.youwei-agent.com;

    # relay-only: the ECS public IP
    allow 8.159.158.155;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        client_max_body_size 50m;
    }
}
