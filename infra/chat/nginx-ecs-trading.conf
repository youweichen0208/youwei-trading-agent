# cn-shanghai ECS nginx site: the public China entry for the chat UI.
#
# Deployed by the chat-entry finish steps; TLS lines added by certbot
# (2026-12-31 expiry, auto-renew). Optimized 2026-10-03 after the page
# took ~6s for the HTML alone: every request was re-paying the CN->SG
# TLS handshake (~1.2s). Three fixes:
#
#   1. upstream keepalive pool — one handshake per connection, reused
#      for the whole page load (per-request proxy_pass variables cannot
#      use keepalive, hence the upstream block; the hostname resolves
#      at nginx load time, the SG droplet IP is stable)
#   2. a local cache for content-hashed immutable assets
#      (/_app/immutable/*, 30d) and /static/* (10m) — the bulk of the
#      SPA payload then answers from Shanghai directly
#   3. Connection header mapped from the Upgrade header, so websocket
#      upgrades still work while normal requests keep the connection
#      alive for reuse
#
# Login attempts stay rate-limited; everything else is auth-gated by
# Open WebUI itself.

resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;

limit_req_zone $binary_remote_addr zone=chat_signin:10m rate=5r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream sg_chat_backend {
    server sg-chat.youwei-agent.com:443;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 120s;
}

proxy_cache_path /var/cache/nginx/youwei-chat
                 levels=1:2 keys_zone=chat_static:10m
                 max_size=200m inactive=30d use_temp_path=off;

server {
    server_name trading.youwei-agent.com;

    # content-hashed SvelteKit chunks: immutable by construction
    location /_app/immutable/ {
        proxy_cache chat_static;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass https://sg_chat_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name sg-chat.youwei-agent.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host sg-chat.youwei-agent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # mostly immutable loader assets; custom.css may change -> 10m
    location /static/ {
        proxy_cache chat_static;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass https://sg_chat_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name sg-chat.youwei-agent.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host sg-chat.youwei-agent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass https://sg_chat_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name sg-chat.youwei-agent.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host sg-chat.youwei-agent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        client_max_body_size 50m;
    }

    # brute-force guard on the auth endpoints only; the rest of the UI
    # is behind Open WebUI accounts
    location /api/v1/auths/ {
        limit_req zone=chat_signin burst=10 nodelay;
        proxy_pass https://sg_chat_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name sg-chat.youwei-agent.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host sg-chat.youwei-agent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/trading.youwei-agent.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trading.youwei-agent.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = trading.youwei-agent.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name trading.youwei-agent.com;
    return 404; # managed by Certbot


}
