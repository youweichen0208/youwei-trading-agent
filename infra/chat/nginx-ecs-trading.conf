# cn-shanghai ECS nginx site: the public China entry for the chat UI.
#
# Deployed by the chat-entry finish steps:
#   /etc/nginx/sites-available/trading -> sites-enabled symlink
#   certbot --nginx -d trading.youwei-agent.com (adds the 443/TLS block)
#
# TLS terminates here (ICP filing verified operationally: market.
# youwei-agent.com has served from this host on 443); the upstream hop
# to sg-prod is HTTPS with SNI (sg-chat.youwei-agent.com). The upstream
# hostname is resolved per-request via a resolver so this config loads
# before the DNS record exists. Login attempts are rate-limited;
# everything else is auth-gated by Open WebUI itself.

resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;

limit_req_zone $binary_remote_addr zone=chat_signin:10m rate=5r/m;

server {
    listen 80;
    server_name trading.youwei-agent.com;

    location / {
        set $chat_upstream https://sg-chat.youwei-agent.com;
        proxy_pass $chat_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name sg-chat.youwei-agent.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host sg-chat.youwei-agent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        client_max_body_size 50m;
    }

    # brute-force guard on the auth endpoints only; the rest of the UI
    # is behind Open WebUI accounts
    location /api/v1/auths/ {
        limit_req zone=chat_signin burst=10 nodelay;
        set $chat_upstream https://sg-chat.youwei-agent.com;
        proxy_pass $chat_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name sg-chat.youwei-agent.com;
        proxy_http_version 1.1;
        proxy_set_header Host sg-chat.youwei-agent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
        client_max_body_size 10m;
    }
}
