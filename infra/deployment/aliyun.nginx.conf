upstream alpha_lab_digitalocean {
    server 168.144.39.34:443;
    keepalive 16;
}
map "$request_method:$http_rsc" $alpha_entry_file {
    default /__forward_to_next;
    ~^(GET|HEAD):$ /index.html;
}
map "$request_method:$cookie_alpha_session" $alpha_missing_session {
    default 0;
    "GET:" 1;
}
server {
    listen 80;
    server_name trading.youwei-agent.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://trading.youwei-agent.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name trading.youwei-agent.com;
    ssl_certificate /etc/letsencrypt/live/trading.youwei-agent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.youwei-agent.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    gzip_static on;
    gzip_vary on;
    location = / {
        root /var/www/hermes-alpha-lab/current;
        try_files $alpha_entry_file @alpha_origin;
        add_header Cache-Control "no-cache";
    }
    location ^~ /_next/static/ {
        root /var/www/hermes-alpha-lab/assets;
        try_files $uri @alpha_origin;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location @alpha_origin {
        include /etc/nginx/snippets/alpha-lab-origin.conf;
    }
    location = /api/auth/session {
        # No cookie cannot be an authenticated session. Never cache or infer a
        # logged-in identity here; every present cookie is validated upstream.
        default_type application/json;
        if ($alpha_missing_session) {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 401 '{"error":"unauthorized"}';
        }
        include /etc/nginx/snippets/alpha-lab-origin.conf;
    }
    location / {
        include /etc/nginx/snippets/alpha-lab-origin.conf;
    }
}
