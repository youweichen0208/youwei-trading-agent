server {
    listen 80;
    server_name sg-chat.youwei-agent.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://trading.youwei-agent.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name sg-chat.youwei-agent.com trading.youwei-agent.com;
    ssl_certificate /etc/letsencrypt/live/sg-chat.youwei-agent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sg-chat.youwei-agent.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    if ($host = sg-chat.youwei-agent.com) { return 301 https://trading.youwei-agent.com$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host trading.youwei-agent.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
    }
}
