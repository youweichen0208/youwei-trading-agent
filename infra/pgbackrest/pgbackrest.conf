# pgBackRest configuration for the youwei Phase 1A environments.
#
# Deployed by ops/s09b_deploy.py to <deploy-base>/<env>/pgbackrest/
# and mounted read-only into the postgres container (archive-push) and
# the one-shot backup/restore containers (run via
# `ops/s09b_deploy.py --env <env> pgbackrest <args>`).
#
# repo1 is a local posix directory for now: it protects against
# application-level data loss (bad migration, dropped table, corrupt
# cluster) but NOT against host loss — the independent-failure-domain
# off-site copy (S3 or another authorized target) is a pending owner
# decision and only changes the [global] repo1-* settings.

[global]
repo1-path=/repo
repo1-retention-full=7
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info

[youwei]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/socket
pg1-port=5432
pg1-user=youwei_owner
pg1-database=youwei
