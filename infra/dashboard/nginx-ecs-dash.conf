# cn-shanghai ECS nginx site: the public China entry for the dashboard.
#
# Deploy:
#   /etc/nginx/sites-available/dash -> sites-enabled symlink
#   certbot --nginx -d dash.youwei-agent.com  (adds the 443/TLS block)
#
# TLS terminates here (same verified-operationally pattern as trading);
# the upstream hop to sg-prod is HTTPS with SNI (sg-dash.youwei-agent.com),
# resolved per-request so this config loads before DNS exists. The app
# behind it is Basic-Auth gated by the dashboard proxy; a gentle global
# rate limit blunts credential brute force. (resolver is declared once
# by the trading site at http level — do not repeat it here.)

limit_req_zone $binary_remote_addr zone=dash_req:10m rate=60r/m;

server {
    listen 80;
    server_name dash.youwei-agent.com;

    location / {
        limit_req zone=dash_req burst=120 nodelay;
        set $dash_upstream https://sg-dash.youwei-agent.com;
        proxy_pass $dash_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name sg-dash.youwei-agent.com;
        proxy_http_version 1.1;
        proxy_set_header Host sg-dash.youwei-agent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 1m;
    }
}
