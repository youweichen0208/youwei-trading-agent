# sg-prod nginx site: the dashboard backend entry (behind the CN ECS relay).
#
# Deploy:
#   /etc/nginx/sites-available/sg-dash -> sites-enabled symlink
#   certbot --nginx -d sg-dash.youwei-agent.com  (adds the 443/TLS block)
#
# Only the CN relay ECS may talk to this vhost (same shape as sg-chat).
# The app behind it is Basic-Auth gated by the dashboard proxy itself;
# this just keeps the SG surface minimal.

server {
    listen 80;
    server_name sg-dash.youwei-agent.com;

    # relay-only allow/deny INSIDE location / so the ACME HTTP-01
    # challenge (a more specific location, inserted by certbot) is
    # never blocked by the deny rule.
    location / {
        allow 8.159.158.155;
        deny all;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 1m;
    }
}
