    { name = "alembic", specifier = ">=1.14,<1.16" },
    { name = "asyncpg", specifier = ">=0.30,<0.31" },
    { name = "fastapi", specifier = ">=0.115,<0.116" },
    { name = "httpx", specifier = ">=0.28,<0.29" },
    { name = "pydantic", specifier = ">=2.10,<3" },
    { name = "pydantic-settings", specifier = ">=2.7,<3" },
    { name = "sqlalchemy", extras = ["asyncio"], specifier = ">=2.0.36,<2.1" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.32,<0.34" },
]

[package.metadata.requires-dev]
dev = [
    { name = "httpx", specifier = ">=0.28,<0.29" },
    { name = "pytest", specifier = ">=8.3,<9" },
    { name = "pytest-asyncio", specifier = ">=0.25,<1" },
]
