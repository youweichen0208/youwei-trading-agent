[project]
name = "youwei-runner"
version = "0.1.0"
description = "Isolated sandbox execution service; no Core or database dependency"
requires-python = ">=3.13,<3.14"
dependencies = [
  "youwei-contracts",
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.32,<0.34",
  "pydantic-settings>=2.7,<3",
]

[project.scripts]
youwei-runner = "youwei_runner.main:main"

[tool.uv.sources]
youwei-contracts = { path = "../../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youwei_runner"]
