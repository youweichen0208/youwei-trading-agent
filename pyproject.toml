[project]
name = "hermes-alpha-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["exchange-calendars>=4.13,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["services/quant", "services/hermes"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".local", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
